# data/employer-aliases.yaml · 品牌/子公司公告名 → 雇主主体名（防重投按主体查，contracts §8.4）
#
# host/registry.py 的 employer_key 归一化会先剥「括号内容 + 股份有限公司/集团/校招 等后缀」，
# 再查本表。本表只收录**有留痕证据确认同一雇主/同一门户**的关系；拿不准的一律不写
#（独立运营的子公司是不同雇主、不同门户，不构成重复投递——这类子公司不要加进来）。
#
# 写法：aliases: 公告上出现的名字: 雇主主体名（剥后缀后能匹配上的写法）

version: 1
aliases:
  # 示例：子品牌走母公司的校招统一门户、公告标题把两个名字并列写在一起时，加一条
  星河智能科技（示例）: 星河智能（示例）
