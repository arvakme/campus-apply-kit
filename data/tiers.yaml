# data/tiers.yaml · 公司 → 层级（大厂 / 名企 / 国企 / 外企；未列出的公司默认 中小）
#
# 这是一份很短的示例，只为让 scan.py 的「层级分」有东西可算。自己维护：
#   - 公司名要和你数据源里公告的 company 字段写法一致（scan.py 按字面匹配）
#   - 同一公司只能出现在一个组里（读到重复会报错）；按层级分组、组内排序，一行一个，方便 diff
#   - 未列出的公司：公告 company_tags 含「国企」或「事业单位」→ 国企，其余 → default
#   - 下面带「（示例）」的是 data/sample/ 里的虚构公司
version: 1
default: 中小
tiers:
  大厂:
    - 星河智能（示例）
    - 远航汽车（示例）
    - 阿里巴巴
    - 字节跳动
    - 腾讯
    - 华为
    - 美团
  名企:
    - 青柠科技（示例）
    - 蓝鲸芯片（示例）
  国企:
    - 北辰能源集团（示例）
    - 橙子银行（示例）
  外企:
    - 微软
    - 英特尔
