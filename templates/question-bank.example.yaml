# question-bank.yaml 示例（无答案）
# 整理自真实门户表单里常见的字段，不含任何答案。
# 用法：复制到 $CAMPUS_INSTANCE/question-bank.yaml，经 host/qb.py 或 web /bank 填 answer；不要手改生成的 question-bank.md。
# 字段：kind=value 直接填值；rule=填写规则（worker 按规则现场判断）；secret=敏感值，网页只显示已填/未填。
# required=true 表示多数门户必填，缺了 worker 会 blocked。
version: 1
items:
  # ---------- 账号 ----------
  - id: login-email
    question: 默认登录/注册邮箱
    aliases: [注册邮箱, 登录邮箱, 常用邮箱]
    category: 账号
    kind: value
    required: true
    hint: 门户提供邮箱方式时优先用它；验证码经 himalaya 读取
    answer: ""
    updated: null
    source: null
  - id: portal-password
    question: 新门户注册密码
    aliases: [设置密码, 登录密码]
    category: 账号
    kind: secret
    required: true
    placeholder: "<改成你自己的密码>"
    hint: 占位值，必须改成你自己的密码。建议 10 位以上、字母开头、含大小写字母+数字+特殊字符，可满足大多数门户规则；已有账号以 accounts.md 为准
    answer: ""
    updated: null
    source: null
  - id: portal-username
    question: 门户用户名（需要用户名登录的门户用）
    aliases: [用户名, 登录名]
    category: 账号
    kind: value
    required: false
    hint: 统一口径如姓名全拼小写；研究院所、银行类门户常要求用户名+密码+图形验证码登录
    answer: ""
    updated: null
    source: null

