rules:
  - id: declaration-wording
    text: 声明类问题按具体问法判断，不机械选“否”。问“是否有不良记录”答否，问“是否无不良记录”答是。拿不准的措辞 blocked 问主持人。
  - id: rank-downgrade
    text: 排名、分数段等选项没有精确档位时，向下取最近的档（例如没有“前15%”选“前20%”），不向上取。
  - id: city-order
    text: 意向城市多选时按 intent.cities.prefer 顺序勾选可选项；岗位城市固定的随岗位；只能选 avoid 城市时按 intent.judgment_notes 处理。
  - id: monthly-from-annual
    text: 期望月薪未单独给出时，取期望年薪上限除以 12，并按控件单位（元/千/万）换算。
  - id: numbers-no-fabrication
    text: GPA、排名、分数、天数等数字只取简历或问题库；都没有就留空，必填则 blocked。不得填 0 或估算值冒充。
  - id: major-mapping
    text: 专业库没有精确专业时，先按 major-mapping 条目的优先级选；该条为空时选最接近的标准专业名，仍没有选“其他”并手填简历原专业名。
  - id: intern-into-project
    text: 表单没有“实习经历”栏但有“项目经历”栏时，把实习经历写进项目经历。
  - id: ongoing-end-date
    text: 进行中的经历，控件没有“至今”时结束时间选当前月，并在留痕注明。
  - id: placeholder-values
    text: 家人或实习联系人的联系方式等，用户选择不提供真实值时，占位值必须由用户写进对应条目；worker 只照抄，不自行生成。
  - id: old-account-override
    text: 登录已有历史账号时，存量字段与问题库冲突的以问题库为准覆盖；旧简历附件替换为当前版本并刷新回读。
  - id: attachments-policy
    text: 表单强制上传成绩单、在读证明、学生证等材料时，按 intent.policies.attachments_required 处理；外企一律 blocked。
  - id: special-chars
    text: 长文本字段避免 # $ / < > 等特殊字符，技术栈用顿号分隔（如“Go、Python”），部分门户会静默拒收。
  - id: cert-number-lookup
    text: 证书编号查询路径——学历证书编号=毕业证原件右下角/学信网→学历查询；学位证书编号=学位证原件/学信网→学位查询；留服认证书编号=教育部留学服务中心认证书 PDF 右上角；四六级成绩单编号在成绩报告单上。编号留空必须注明原因（在读/未取证）。
  - id: cert-number-blankable
    text: 编号类字段被前端标必填但问题库无值时：不编造；先尝试留空保存（部分门户仅前端校验、服务端接受空值），成功则留痕标“可补录”并提醒用户补录；保存被拦则 blocked 问主持人。
  - id: overseas-education-group
    text: 海外学历字段是连锁触发：教育段选“国外高校/海外留学”后会出现留服认证时限、外国国籍居留权、海外工作经历、留学国家、境外停留/学习天数等必填组——海外背景用户必须把整组（liufu-deadline/foreign-residency/overseas-work/study-country/overseas-days）预置齐全。
  - id: bank-extra-fields
    text: 银行/国企门户字段面更宽：身高、体重、健康、入党时间、户口到县、生源地、档案单位、父母全字段、高中段、笔试城市、生活照集中出现；投这类门户前先确认对应条目已填。
  - id: late-validation
    text: 部分门户的必填校验只在点保存/提交后才全部暴露；进这类门户前按该门户 playbook 列的必填清单一次备齐，再保存。
  - id: forced-rows
    text: 北森系等门户的“在校实践/在校职务/获奖”行强制存在且不可删，空行也拦提交——问题库至少各备一条可填内容；若 portal 的“添加”按钮语义是开新空块而非保存，多出的空白块要删掉。
  - id: optional-blank
    text: 选填字段无数据源时留空即可，不编造；但“留空可补录”只适用于明确标注选填或实测可空提交的字段，必填字段无数据源仍走 blocked。留空的必填项在留痕里标“可补录”。
  - id: attachment-verify-refresh
    text: 附件上传的验证标准只有一条：保存后刷新页面/重进该页回读，确认服务端文件名/链接在。页面即时回显不等于落库。
  - id: education-per-degree
    text: 教育类条目按学历分行写（如“硕士：…；本科：…”），高中段单独一条；表单按段拆问时逐段对应。
  - id: date-normalize
    text: 日期统一按控件要求转 YYYY-MM-DD / YYYY-MM / YYYY/MM/DD；进行中经历无“至今”选项时取当前月并在留痕注明。
  - id: volunteer-first
    text: 志愿顺序默认第1志愿；多志愿门户按岗位匹配度排序，不重复投递同岗。
  - id: industry-decl-generalize
    text: “本行业从业/亲属任职”类声明按门户行业泛化：银行问银行从业、电信问运营商实习、金融问监管系统任职——用 decl-industry-exp / decl-regulator / decl-relative-* 一组覆盖。

